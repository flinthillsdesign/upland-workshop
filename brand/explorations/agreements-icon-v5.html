<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Instrument Sans",system-ui,sans-serif;background:#0c0b0e;color:#c8c5cc;min-height:100vh}
.page{max-width:1200px;margin:0 auto;padding:4rem 2rem 6rem}
.suite-header{margin-bottom:4.5rem}
.suite-header::after{content:"";display:block;width:48px;height:2px;background:#a5bc39;margin-top:1.5rem}
.suite-name{font-size:.7rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:#a5bc39;margin-bottom:.6rem}
.suite-title{font-size:1.8rem;font-weight:400;color:#eae8ed}
.section{margin-bottom:5rem}
.section-label{font-size:.65rem;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:#605c66;margin-bottom:2rem}
.icon-row{display:flex;justify-content:center;gap:2.5rem;flex-wrap:wrap;align-items:flex-start}
.icon-cell{display:flex;flex-direction:column;align-items:center;gap:.7rem}
.icon-cell svg{filter:drop-shadow(0 4px 20px rgba(0,0,0,.6));transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.icon-cell:hover svg{transform:translateY(-3px) scale(1.05)}
.icon-cell .name{font-size:.78rem;font-weight:600;color:#d8d5dc}
.icon-cell .sub{font-size:.6rem;color:#555059;margin-top:-.3rem;max-width:100px;text-align:center}
.dock-wrap{display:flex;justify-content:center}
.dock-group{display:flex;flex-direction:column;align-items:center}
.dock{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05);border-radius:22px;padding:14px 28px;display:inline-flex;gap:14px;align-items:center}
.dock svg,.dock img{filter:drop-shadow(0 2px 10px rgba(0,0,0,.5));transition:transform .2s cubic-bezier(.34,1.56,.64,1);cursor:default}
.dock svg:hover,.dock img:hover{transform:translateY(-6px) scale(1.15)}
.dock-labels{display:flex;gap:14px;padding:0 28px;margin-top:.6rem}
.dock-labels span{width:52px;text-align:center;font-size:.5rem;color:#3e3b42;letter-spacing:.02em}
.dock-section{margin-bottom:3rem}
.dock-section .dock-title{font-size:.6rem;font-weight:600;color:#444;letter-spacing:.08em;text-align:center;margin-bottom:1rem}
.dock-section .dock-title em{color:#a5bc39;font-style:normal}
</style>
</head>
