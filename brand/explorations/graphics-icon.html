<!doctype html><html><head><meta charset="utf-8"><title>Graphics icon explorations</title>
<style>
body{margin:0;padding:32px;background:#f3f2ee;font:14px/1.4 -apple-system,Helvetica,sans-serif;color:#333}
h1{font-size:16px;margin:0 0 20px}
.row{display:flex;gap:28px;flex-wrap:wrap;margin-bottom:28px}
.cell{display:flex;flex-direction:column;align-items:center;gap:10px}
.cell span{font-size:12px;color:#666}
.sizes{display:flex;gap:14px;align-items:flex-end}
.dark{background:#1b1e26;padding:16px 20px;border-radius:10px}
</style></head><body>
<h1>Graphics — icon explorations (dark bg = suite, cut-line magenta = the app's one accent)</h1>

<svg width="0" height="0" style="position:absolute"><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#161A22"/><stop offset="100%" stop-color="#0A0D12"/></linearGradient>
</defs></svg>

<script>
const M='#D9407F', MD='#b0245f', W='#fff';
const bg = `<rect width="256" height="256" rx="44" fill="url(#bg)"/><rect width="256" height="256" rx="44" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>`;
const label = (x,y,w,h,r=8) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${W}"/>`;
const text = (x,y,w) => `<rect x="${x}" y="${y}" width="${w}" height="10" rx="5" fill="#23221f" opacity="0.85"/>`;
const rule = (x,y,w,op=0.35) => `<rect x="${x}" y="${y}" width="${w}" height="6" rx="3" fill="#23221f" opacity="${op}"/>`;

const concepts = {
 // A: label with a dashed cut line outside it (trim + bleed)
 A: bg + label(62,78,132,100,6) + text(80,100,60) + rule(80,124,96) + rule(80,140,72)
   + `<rect x="50" y="66" width="156" height="124" rx="10" fill="none" stroke="${M}" stroke-width="5" stroke-dasharray="12 10" stroke-linecap="round"/>`,
 // B: label + crop marks at the corners
 B: bg + label(64,80,128,96,4) + text(82,102,56) + rule(82,126,92) + rule(82,142,68)
   + [[64,80,-1,-1],[192,80,1,-1],[64,176,-1,1],[192,176,1,1]].map(([x,y,dx,dy])=>
     `<line x1="${x}" y1="${y+dy*8}" x2="${x}" y2="${y+dy*30}" stroke="${M}" stroke-width="6" stroke-linecap="round"/>
      <line x1="${x+dx*8}" y1="${y}" x2="${x+dx*30}" y2="${y}" stroke="${M}" stroke-width="6" stroke-linecap="round"/>`).join(''),
 // C: bleed = magenta sheet behind, trim = white label on top, offset
 C: bg + `<rect x="52" y="68" width="152" height="120" rx="8" fill="${M}"/>` + label(64,80,128,96,4) + text(82,102,56) + rule(82,126,92) + rule(82,142,68),
 // D: fanned stack of labels, top one carries the cut line
 D: bg + `<rect x="80" y="60" width="132" height="96" rx="6" fill="${W}" opacity="0.3"/><rect x="66" y="74" width="132" height="96" rx="6" fill="${W}" opacity="0.55"/>`
   + label(52,88,132,96,6) + text(70,110,56) + rule(70,134,92) + rule(70,150,68)
   + `<rect x="52" y="88" width="132" height="96" rx="6" fill="none" stroke="${M}" stroke-width="5" stroke-dasharray="12 10" stroke-linecap="round"/>`,
 // E: big Aa on a label with a magenta cut line
 E: bg + label(60,72,136,112,6)
   + `<text x="128" y="152" text-anchor="middle" font-family="'Source Sans 3','Instrument Sans',Helvetica,Arial,sans-serif" font-weight="600" font-size="78" fill="#23221f">Aa</text>`
   + `<rect x="48" y="60" width="160" height="136" rx="10" fill="none" stroke="${M}" stroke-width="5" stroke-dasharray="12 10" stroke-linecap="round"/>`,
 // F: minimal — white label, magenta cut line, no text rows at all
 F: bg + label(66,86,124,84,4)
   + `<rect x="52" y="72" width="152" height="112" rx="8" fill="none" stroke="${M}" stroke-width="6" stroke-dasharray="14 11" stroke-linecap="round"/>`,
};
const svg = (body,size) => `<svg width="${size}" height="${size}" viewBox="0 0 256 256">${body}</svg>`;
let html = '';
for (const [k,body] of Object.entries(concepts)) {
  html += `<div class="row"><div class="cell">${svg(body,160)}<span>${k}</span></div>
  <div class="cell sizes">${svg(body,96)}${svg(body,64)}${svg(body,48)}${svg(body,32)}${svg(body,16)}</div>
  <div class="cell dark sizes">${svg(body,64)}${svg(body,32)}${svg(body,16)}</div></div>`;
}
document.body.insertAdjacentHTML('beforeend', html);
</script>
</body></html>
