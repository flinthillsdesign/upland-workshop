<!doctype html><html><head><meta charset="utf-8"><title>Graphics icon v3</title>
<style>
body{margin:0;padding:32px;background:#f3f2ee;font:14px/1.4 -apple-system,Helvetica,sans-serif;color:#333}
h1{font-size:16px;margin:0 0 20px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:24px 40px}
.row{display:flex;gap:22px;align-items:flex-start}
.cell{display:flex;flex-direction:column;align-items:center;gap:8px}
.cell span{font-size:12px;color:#666;max-width:150px;text-align:center}
.sizes{display:flex;gap:12px;align-items:flex-end}
.dark{background:#1b1e26;padding:14px 16px;border-radius:10px}
.light{background:#fff;padding:14px 16px;border-radius:10px}
</style></head><body>
<h1>Graphics — v3: refining G (lime bleed) and B (plain)</h1>
<svg width="0" height="0" style="position:absolute"><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#161A22"/><stop offset="100%" stop-color="#0A0D12"/></linearGradient>
<clipPath id="s1"><rect x="48" y="66" width="160" height="124" rx="4"/></clipPath>
<clipPath id="s2"><rect x="44" y="62" width="168" height="132" rx="4"/></clipPath>
<clipPath id="s3"><rect x="52" y="74" width="152" height="108" rx="4"/></clipPath>
</defs></svg>
<div class="grid" id="g"></div>
<script>
const M='#D9407F', W='#fff', INK='#23221f', LIME='#A5BC39';
const bg = `<rect width="256" height="256" rx="44" fill="url(#bg)"/><rect width="256" height="256" rx="44" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>`;
const title=(x,y,w)=>`<rect x="${x}" y="${y}" width="${w}" height="10" rx="5" fill="${INK}" opacity="0.85"/>`;
const rule=(x,y,w)=>`<rect x="${x}" y="${y}" width="${w}" height="6" rx="3" fill="${INK}" opacity="0.35"/>`;
const cut=(x,y,w,h,sw=4.5)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="none" stroke="${M}" stroke-width="${sw}" stroke-linejoin="round"/>`;
const sheet=(x,y,w,h)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" fill="${W}"/>`;
const C={
 'G1 · as G, lime band 56, cut 4.5': bg+sheet(48,66,160,124)+`<rect x="48" y="66" width="160" height="56" fill="${LIME}" clip-path="url(#s1)"/>`+cut(60,78,136,100)+title(78,138,62)+rule(78,160,100),
 'G2 · lime band shorter (44), heavier cut 6': bg+sheet(48,66,160,124)+`<rect x="48" y="66" width="160" height="44" fill="${LIME}" clip-path="url(#s1)"/>`+cut(60,78,136,100,6)+title(78,128,62)+rule(78,150,100)+rule(78,164,72),
 'G3 · bigger sheet, bleed 8, band 60': bg+sheet(44,62,168,132)+`<rect x="44" y="62" width="168" height="60" fill="${LIME}" clip-path="url(#s2)"/>`+cut(52,70,152,116,5)+title(72,138,66)+rule(72,162,108),
 'G4 · lime block on the left third bleeds off left+top+bottom': bg+sheet(48,66,160,124)+`<rect x="48" y="66" width="60" height="124" fill="${LIME}" clip-path="url(#s1)"/>`+cut(60,78,136,100)+title(124,100,52)+rule(124,124,60)+rule(124,140,44),
 'G5 · lime circle (a photo) cropped by the cut, top-right': bg+sheet(48,66,160,124)+`<circle cx="176" cy="94" r="46" fill="${LIME}" clip-path="url(#s1)"/>`+cut(60,78,136,100)+title(78,140,62)+rule(78,162,80),
 'G6 · wider sheet 152×108, band 48, two rules': bg+sheet(52,74,152,108)+`<rect x="52" y="74" width="152" height="48" fill="${LIME}" clip-path="url(#s3)"/>`+cut(64,86,128,84,4.5)+title(82,134,60)+rule(82,154,92),
 'B1 · plain, cut 4.5, three lines': bg+sheet(48,66,160,124)+title(78,98,62)+rule(78,124,100)+rule(78,140,76)+cut(60,78,136,100),
 'B2 · plain, cut 6, title + one rule, more air': bg+sheet(48,66,160,124)+title(80,110,66)+rule(80,138,96)+cut(60,78,136,100,6),
};
const svg=(b,s)=>`<svg width="${s}" height="${s}" viewBox="0 0 256 256">${b}</svg>`;
let h='';
for(const [k,b] of Object.entries(C)) h+=`<div class="row"><div class="cell">${svg(b,150)}<span>${k}</span></div><div class="cell sizes">${svg(b,64)}${svg(b,32)}${svg(b,16)}</div><div class="cell dark sizes">${svg(b,64)}${svg(b,32)}${svg(b,16)}</div></div>`;
document.getElementById('g').innerHTML=h;
</script></body></html>
