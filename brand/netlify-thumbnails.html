<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Upland Workshop — Netlify Thumbnails</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Instrument Sans",system-ui,sans-serif;background:#0c0b0e;color:#c8c5cc;min-height:100vh}
.page{max-width:1060px;margin:0 auto;padding:4rem 2rem 6rem}
.header{margin-bottom:3rem}
.header::after{content:"";display:block;width:48px;height:2px;background:#a5bc39;margin-top:1.5rem}
.label{font-size:.7rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:#a5bc39;margin-bottom:.6rem}
h1{font-size:1.8rem;font-weight:400;color:#eae8ed}
.note{font-size:.8rem;color:#605c66;margin-top:.8rem}
.controls{display:flex;gap:.6rem;margin-bottom:2rem}
.size-btn{padding:.45rem 1rem;font-family:inherit;font-size:.7rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#605c66;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:6px;cursor:pointer;transition:all .15s}
.size-btn:hover{color:#c8c5cc;border-color:rgba(255,255,255,.15)}
.size-btn.active{color:#161A22;background:#A5BC39;border-color:#A5BC39}
.thumb-section{margin-bottom:3rem;transition:margin .2s}
.thumb-label{font-size:.85rem;font-weight:600;color:#d8d5dc;margin-bottom:.8rem;display:flex;align-items:center;gap:.8rem}
.thumb-label span{font-size:.65rem;font-weight:400;color:#555059}
.thumb-wrap{position:relative;width:100%;aspect-ratio:960/600;border-radius:12px;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,.5);transition:all .2s}
.thumb-wrap canvas{display:block;width:100%;height:100%}
body.size-netlify .thumb-section{margin-bottom:1.5rem}
body.size-netlify .thumb-wrap{width:192px;border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,.4)}
body.size-netlify #thumbnails{display:flex;flex-wrap:wrap;gap:1.5rem}
body.size-netlify .thumb-label{font-size:.7rem;margin-bottom:.5rem}
body.size-netlify .save-btn{display:none}
.save-btn{margin-top:.8rem;display:inline-block;padding:.5rem 1.2rem;font-family:inherit;font-size:.75rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#161A22;background:#A5BC39;border:none;border-radius:6px;cursor:pointer;transition:opacity .2s}
.save-btn:hover{opacity:.85}
body.size-netlify .save-btn{display:none}
.save-all-btn{margin-left:auto;padding:.45rem 1.2rem;font-family:inherit;font-size:.7rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#161A22;background:#A5BC39;border:none;border-radius:6px;cursor:pointer;transition:opacity .2s}
.save-all-btn:hover{opacity:.85}
</style>
</head>
<body>
<div class="page">
<div class="header">
<div class="label">Upland Workshop</div>
<h1>Netlify Thumbnails</h1>
<p class="note">960 &times; 600px (1.6:1) — Click "Save PNG" to download each thumbnail.</p>
</div>
<div class="controls">
<button class="size-btn active" data-size="full">Full Size</button>
<button class="size-btn" data-size="netlify">Netlify (192 &times; 120)</button>
<button class="save-all-btn" id="saveAll">Save All PNGs</button>
</div>
<div id="thumbnails"></div>
</div>

function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

function renderThumbnail(ctx, img, app) {
  const W = 960, H = 600;

  // Background gradient
  const grad = ctx.createLinearGradient(0, 0, W, H);
  grad.addColorStop(0, '#161A22');
  grad.addColorStop(1, '#0A0D12');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Large green glow behind icon
  const glow = ctx.createRadialGradient(W/2, H/2 - 50, 0, W/2, H/2 - 50, 400);
  glow.addColorStop(0, 'rgba(165,188,57,0.25)');
  glow.addColorStop(0.4, 'rgba(165,188,57,0.1)');
  glow.addColorStop(1, 'rgba(165,188,57,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, H);

  // Secondary cool glow for depth
  const cool = ctx.createRadialGradient(W/2 + 180, H/2 - 80, 0, W/2 + 180, H/2 - 80, 350);
  cool.addColorStop(0, 'rgba(107,160,204,0.12)');
  cool.addColorStop(0.5, 'rgba(107,160,204,0.04)');
  cool.addColorStop(1, 'rgba(107,160,204,0)');
  ctx.fillStyle = cool;
  ctx.fillRect(0, 0, W, H);

  // Warm accent glow bottom-left
  const warm = ctx.createRadialGradient(W/2 - 200, H/2 + 100, 0, W/2 - 200, H/2 + 100, 300);
  warm.addColorStop(0, 'rgba(165,188,57,0.08)');
  warm.addColorStop(1, 'rgba(165,188,57,0)');
  ctx.fillStyle = warm;
  ctx.fillRect(0, 0, W, H);

  // Vignette — darken edges
  const vig = ctx.createRadialGradient(W/2, H/2, 180, W/2, H/2, 540);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(0,0,0,0.5)');
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, W, H);

  // Layout: icon + title centered as a single group
  const iconSize = 380;
  const iconTextGap = 44;
  const nameFontSize = 80;
  const nameCapH = nameFontSize * 0.72;
  const totalH = iconSize + iconTextGap + nameCapH;
  const groupTop = (H - totalH) / 2;

  // Draw icon from SVG
  if (img) {
    ctx.drawImage(img, W/2 - iconSize/2, groupTop, iconSize, iconSize);
  }

  // App name
  ctx.fillStyle = '#eae8ed';
  ctx.font = `600 ${nameFontSize}px "Instrument Sans", system-ui, sans-serif`;
  ctx.textAlign = 'center';
  ctx.fillText(app.name, W/2, groupTop + iconSize + iconTextGap + nameCapH);
}

function savePNG(canvas, name) {
  const link = document.createElement('a');
  link.download = `netlify-thumb-${name.toLowerCase().replace(/\s+/g, '-')}.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
}

// Render all thumbnails after fonts load
document.fonts.ready.then(async () => {
  const container = document.getElementById('thumbnails');

  for (const app of APPS) {
    const img = await loadImage(app.icon);

    const section = document.createElement('div');
    section.className = 'thumb-section';

    const label = document.createElement('div');
    label.className = 'thumb-label';
    label.innerHTML = `${app.name}`;
    section.appendChild(label);

    const wrap = document.createElement('div');
    wrap.className = 'thumb-wrap';
    const canvas = document.createElement('canvas');
    canvas.width = 960;
    canvas.height = 600;
    const ctx = canvas.getContext('2d');
    renderThumbnail(ctx, img, app);
    wrap.appendChild(canvas);
    section.appendChild(wrap);

    const btn = document.createElement('button');
    btn.className = 'save-btn';
    btn.textContent = 'Save PNG';
    btn.onclick = () => savePNG(canvas, app.name);
    section.appendChild(btn);

    container.appendChild(section);
  }
});

// Save all PNGs
document.getElementById('saveAll').addEventListener('click', () => {
  const canvases = document.querySelectorAll('.thumb-wrap canvas');
  canvases.forEach((canvas, i) => {
    setTimeout(() => savePNG(canvas, APPS[i].name), i * 200);
  });
});

// Size toggle
document.querySelectorAll('.size-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.body.className = btn.dataset.size === 'netlify' ? 'size-netlify' : '';
  });
});
</script>
